<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Asistente RAG - Dra. Nancy Rivera</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f8fafc;
            color: #1e293b;
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 6px;
            white-space: pre-wrap;
            margin-top: 18px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Consultorio Dental — Dra. Nancy Rivera</h2>
        <p>Consulta horarios disponibles, tratamientos y costos (Spring AI + RAG):</p>
        <textarea
            id="pregunta">¿Tiene espacio la Dra. Nancy Rivera el jueves por la tarde para una limpieza dental y cuánto cuesta?</textarea>
        <button onclick="consultar()">Consultar Agenda</button>
        <pre id="resultado">Esperando consulta...</pre>
    </div>
    <script>
        async function consultar() {
            const pregunta = document.getElementById('pregunta').value;
            const resBox = document.getElementById('resultado');
            resBox.textContent = "Consultando vector store y generando respuesta...";
            const res = await fetch('/api/citas/consultar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pregunta })
            });
            const data = await res.json();
            resBox.textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>

</html>
